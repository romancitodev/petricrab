name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: petricrab-app
            asset_name: petricrab-app-linux-x86_64
          - os: windows-latest
            artifact: petricrab-app.exe
            asset_name: petricrab-app-windows-x86_64.exe
          - os: macos-latest
            artifact: petricrab-app
            asset_name: petricrab-app-macos-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff needs the full commit/tag history, not just the tip, to build the changelog.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - run: cargo build --release -p petricrab-app

      - run: cp target/release/${{ matrix.artifact }} ${{ matrix.asset_name }}

      - name: Generate changelog for this tag
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          body_path: CHANGES.md
